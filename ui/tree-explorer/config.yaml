# Конфигурация Tree Explorer

# Файл для сохранения выбранных файлов в JSON формате
# Может быть абсолютным путем или относительным к текущей рабочей директории
# Примеры:
#   - /Users/user/Documents/selected-files.json
#   - ./exports/result.json
#   - ~/Downloads/my-selection.json
#   - selected.json (сохранится в текущей директории)

outputFile: ./tmp/files.json

# Настройки интерфейса (планируется в будущих версиях)
# theme: dark
# showFileSize: true
# maxHistoryEntries: 100
